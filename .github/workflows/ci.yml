name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check scripts
        run: node --check src/core.js && node --check src/scroller.js && node --check src/content.js && node --check popup/popup.js && node --check scripts/package.mjs
      - name: Run unit tests
        run: npm test
      - name: Build release zip
        run: npm run zip
      - name: Verify zip archive integrity
        run: python3 -m zipfile -t dist/scrollim-v*.zip && python3 -m zipfile -l dist/scrollim-v*.zip
