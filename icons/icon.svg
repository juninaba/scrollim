<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17233b" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)" stroke="#334155" stroke-width="3" />

  <!-- Upward motion chevron (gg / Ctrl+u) -->
  <path
    d="M36 52 L64 26 L92 52"
    fill="none"
    stroke="url(#up)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center focus dot -->
  <circle cx="64" cy="64" r="7.5" fill="#e2e8f0" />

  <!-- Downward motion chevron (Shift+G / Ctrl+d) -->
  <path
    d="M36 76 L64 102 L92 76"
    fill="none"
    stroke="url(#down)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
